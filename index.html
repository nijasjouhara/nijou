<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#10251d" />
  <meta name="description" content="Wedding invitation of Asif Nijas Faizy and Jouhara Fathima, 21 September 2026." />
  <title>Asif Nijas Faizy & Jouhara Fathima | Nikah</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <style>

    :root {
      --green: #10251d;
      --deep: #07130e;
      --green2: #1d3b2e;
      --ivory: #f8f1e5;
      --cream: #fffaf1;
      --paper: #fdf8ee;
      --gold: #b8893e;
      --gold2: #d8b36b;
      --brown: #4b3824;
      --muted: #7c6b54;
      --line: #d9c6a5;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--brown);
      font-family: Montserrat, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
      opacity: .12;
      background-image:
        radial-gradient(#7d633b .55px, transparent .55px);
      background-size: 18px 18px;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
    }


    /* =========================
       OPENING SCREEN
    ========================== */

    .loader {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: grid;
      place-items: center;
      text-align: center;

      background:
        radial-gradient(
          circle at 50% 45%,
          #214434 0%,
          #10251d 48%,
          #06110c 100%
        );

      color: #f0d39a;

      transition:
        opacity 1s ease,
        visibility 1s ease;

      animation:
        loaderAutoHide 3.2s ease forwards;
    }

    .loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader::before,
    .loader::after {
      content: "";
      position: absolute;

      width: 180px;
      height: 180px;

      border: 1px solid #d8b36b55;
      border-radius: 50%;

      animation: rotate 18s linear infinite;
    }

    .loader::after {
      width: 260px;
      height: 260px;

      animation-direction: reverse;
      opacity: .55;
    }

    .loader-inner {
      position: relative;
      z-index: 2;
      padding: 28px;
    }

    .loader-small {
      font-size: 9px;
      letter-spacing: .42em;
      text-transform: uppercase;
      color: #d9c6a5;
      margin-bottom: 25px;
    }

    .loader-arabic {
      font-family: "Amiri", serif;

      font-size: clamp(
        38px,
        8vw,
        70px
      );

      line-height: 1.8;

      direction: rtl;

      color: #e6c27b;

      text-shadow:
        0 0 18px #d8b36b33,
        0 2px 20px #0005;

      white-space: nowrap;
    }

    .loader-ornament {
      margin-top: 20px;

      color: #d8b36b;

      font-size: 22px;

      letter-spacing: 10px;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes loaderAutoHide {
      0% {
        opacity: 1;
        visibility: visible;
      }

      65% {
        opacity: 1;
        visibility: visible;
      }

      100% {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }


    /* =========================
       MUSIC BUTTON
    ========================== */

    .music-btn {
      position: fixed;

      right: 18px;
      top: 18px;

      z-index: 100;

      width: 52px;
      height: 52px;

      border: 1px solid #d8b36b77;

      background: #10251ddd;

      color: #fff;

      border-radius: 50%;

      backdrop-filter: blur(12px);

      box-shadow:
        0 10px 30px #0003;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;

      transition: .3s ease;
    }

    .music-btn:hover {
      transform: scale(1.06);
    }

    .music-btn.playing {
      background: var(--gold);

      box-shadow:
        0 0 0 7px #b8893e22,
        0 10px 35px #0004;

      animation: musicPulse 1.8s ease-in-out infinite;
    }

    .music-icon {
      font-size: 18px;
      line-height: 1;
    }

    @keyframes musicPulse {
      50% {
        transform: scale(1.06);
      }
    }


    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 100svh;

      position: relative;

      overflow: hidden;

      display: grid;
      place-items: center;

      background:
        radial-gradient(
          circle at 50% 35%,
          #fffdf8 0%,
          #f2e7d5 48%,
          #d7c3a0 100%
        );

      border-bottom: 1px solid #c6aa7b;

      isolation: isolate;
    }

    .hero::before {
      content: "";

      position: absolute;
      inset: 0;

      opacity: .35;

      background:
        linear-gradient(
          90deg,
          transparent 0 9%,
          #fff8 9.2% 9.5%,
          transparent 9.7% 90.3%,
          #fff8 90.5% 90.8%,
          transparent 91%
        );
    }

    .hero::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 24%;

      background:
        linear-gradient(
          transparent,
          #9d815545
        );

      z-index: 1;
    }

    .pattern {
      position: absolute;
      inset: 0;

      opacity: .13;

      background-image:
        linear-gradient(
          30deg,
          #b8893e 12%,
          transparent 12.5%,
          transparent 87%,
          #b8893e 87.5%,
          #b8893e
        ),
        linear-gradient(
          150deg,
          #b8893e 12%,
          transparent 12.5%,
          transparent 87%,
          #b8893e 87.5%,
          #b8893e
        );

      background-size: 32px 56px;

      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          #000 20%,
          #000 80%,
          transparent
        );
    }

    .stars {
      position: absolute;
      inset: 0;

      background-image:
        radial-gradient(
          #fff 1px,
          transparent 1px
        ),
        radial-gradient(
          #b8893e .7px,
          transparent .7px
        );

      background-size:
        76px 76px,
        43px 43px;

      background-position:
        12px 18px,
        27px 11px;

      opacity: .23;
    }

    .hero-content {
      text-align: center;

      position: relative;

      z-index: 6;

      padding:
        55px 20px 100px;

      max-width: 850px;
    }

    .arabic {
      font-family: "Amiri", serif;

      font-size:
        clamp(
          30px,
          5vw,
          55px
        );

      color: #a87424;

      direction: rtl;

      line-height: 1.5;

      text-shadow:
        0 2px 12px #fff8;

      margin-bottom: 20px;
    }

    .eyebrow {
      letter-spacing: .28em;

      font-size: 10px;

      color: var(--muted);

      font-weight: 600;

      margin:
        0 0 12px;
    }

    .hero h1 {
      font-family:
        "Cormorant Garamond",
        serif;

      font-size:
        clamp(
          48px,
          7vw,
          86px
        );

      line-height: .92;

      font-weight: 500;

      margin:
        14px 0 18px;

      letter-spacing: -.02em;
    }

    .hero h1 span {
      display: block;
    }

    .hero h1 b {
      display: block;

      font-family:
        "Great Vibes",
        cursive;

      color: var(--gold);

      font-weight: 400;

      font-size: .7em;

      margin: 9px;
    }

    .invite {
      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 23px;

      margin: 0;

      color: #66533a;
    }

    .ornament {
      color: var(--gold);

      font-size: 26px;

      margin: 14px;
    }

    .date {
      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 23px;

      letter-spacing: .16em;

      margin: 0;
    }

    .date i {
      font-style: normal;

      font-size: 14px;

      margin-left: 12px;

      letter-spacing: .03em;
    }

    .scroll-cue {
      display: inline-grid;

      place-items: center;

      width: 46px;
      height: 46px;

      border:
        1px solid var(--gold);

      border-radius: 50%;

      margin-top: 22px;

      font-size: 24px;

      background: #fff6;

      animation:
        bob 2.2s ease-in-out infinite;
    }

    @keyframes bob {
      50% {
        transform: translateY(6px);
      }
    }


    /* =========================
       ARCHES
    ========================== */

    .arch {
      position: absolute;

      top: 10%;

      height: 74%;

      width: 28%;

      border:
        10px solid #c59a54aa;

      border-bottom: 0;

      border-radius:
        50% 50% 0 0;

      background:
        linear-gradient(
          90deg,
          #fff9 0,
          #d4b77d2b 50%,
          #fff9 100%
        );

      box-shadow:
        0 0 70px #fff inset,
        0 0 35px #b7893e18;

      z-index: 2;
    }

    .arch::after {
      content: "";

      position: absolute;

      inset: 16px;

      border:
        1px solid #b8893e44;

      border-bottom: 0;

      border-radius:
        50% 50% 0 0;
    }

    .arch-left {
      left: -5%;
    }

    .arch-right {
      right: -5%;
    }

    .lantern {
      position: absolute;

      top: 8%;

      font-size: 40px;

      color: #9a6d2d;

      filter:
        drop-shadow(
          0 8px 10px #8b6b3033
        );

      z-index: 7;

      animation:
        swing 4s ease-in-out infinite;
    }

    .lantern-left {
      left: 4%;
    }

    .lantern-right {
      right: 4%;

      animation-delay: 1.2s;
    }

    @keyframes swing {
      0%, 100% {
        transform: rotate(-4deg);
      }

      50% {
        transform: rotate(4deg);
      }
    }


    /* =========================
       COUPLE ILLUSTRATION
    ========================== */

    .couple {
      position: absolute;

      bottom: -18px;

      z-index: 5;

      width: 240px;
      height: 380px;

      opacity: .98;

      filter:
        drop-shadow(
          0 16px 20px #654d2b18
        );
    }

    .couple-left {
      left: 2%;
    }

    .couple-right {
      right: 2%;
    }

    .man-head,
    .woman-head {
      position: absolute;

      top: 24px;
      left: 76px;

      width: 82px;
      height: 92px;

      border-radius:
        48% 48% 42% 42%;

      background:
        linear-gradient(
          120deg,
          #c98b62,
          #8c583d
        );

      box-shadow:
        inset 13px -2px #70442f;
    }

    .man-head::before {
      content: "";

      position: absolute;

      left: -4px;
      top: -17px;

      width: 91px;
      height: 37px;

      background: #f5ead7;

      border-radius:
        50% 50% 22% 22%;

      border-bottom:
        5px solid #cdbb9e;

      box-shadow:
        0 4px 8px #80633b22;
    }

    .man-head::after {
      content: "";

      position: absolute;

      left: 10px;
      top: 46px;

      width: 16px;
      height: 7px;

      border-radius: 50%;

      background: #4b2e22;

      box-shadow:
        43px 0 #4b2e22;
    }

    .man-body {
      position: absolute;

      top: 108px;
      left: 34px;

      width: 170px;
      height: 285px;

      border-radius:
        75px 75px 0 0;

      background:
        linear-gradient(
          90deg,
          #d9ccb7,
          #fffaf0 50%,
          #d0c0a4
        );

      border-top:
        1px solid #fff;

      box-shadow:
        inset -12px 0 22px #9b835d22;
    }

    .man-body::before {
      content: "";

      position: absolute;

      left: 50%;
      top: 0;

      transform:
        translateX(-50%);

      width: 3px;
      height: 270px;

      background:
        #bca68144;
    }

    .woman-head {
      background:
        linear-gradient(
          120deg,
          #a8785d,
          #79503f
        );
    }

    .woman-head::before {
      content: "";

      position: absolute;

      inset:
        -13px -13px -10px -14px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #8d7d70,
          #4e4039
        );

      z-index: -1;
    }

    .woman-head::after {
      content: "";

      position: absolute;

      left: 7px;
      top: -9px;

      width: 72px;
      height: 125px;

      border-radius: 50%;

      background:
        linear-gradient(
          90deg,
          #c7b9aa,
          #8d8076
        );

      opacity: .96;
    }

    .woman-body {
      position: absolute;

      top: 104px;
      left: 26px;

      width: 184px;
      height: 292px;

      border-radius:
        82px 82px 0 0;

      background:
        linear-gradient(
          90deg,
          #918377,
          #efe6d8 50%,
          #9a8b7d
        );

      box-shadow:
        inset 14px 0 24px #5b4b4033;
    }

    .woman-body::after {
      content: "";

      position: absolute;

      top: 25px;
      left: 35px;
      right: 35px;

      height: 2px;

      background:
        #d8b36b77;

      box-shadow:
        0 22px #d8b36b44,
        0 44px #d8b36b33;
    }

    .floral {
      position: absolute;

      bottom: 5%;

      color: #b7893e;

      font-size: 48px;

      line-height: .6;

      z-index: 8;

      text-shadow:
        0 4px 12px #80602b33;
    }

    .floral-left {
      left: 15%;
    }

    .floral-right {
      right: 15%;
    }


    /* =========================
       GENERAL SECTIONS
    ========================== */

    .section {
      padding:
        100px 7vw;

      text-align: center;

      position: relative;
    }

    .section h2,
    .rsvp h2 {
      font-family:
        "Cormorant Garamond",
        serif;

      font-size:
        clamp(
          40px,
          5vw,
          62px
        );

      font-weight: 500;

      margin:
        8px 0 42px;
    }


    /* =========================
       COUNTDOWN
    ========================== */

    .countdown-section {
      background: var(--cream);
    }

    .countdown {
      max-width: 900px;

      margin: auto;

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      border:
        1px solid var(--line);

      border-radius: 24px;

      overflow: hidden;

      background: #fffdf8;

      box-shadow:
        0 22px 60px #70553312;
    }

    .countdown div {
      padding: 30px 10px;

      border-right:
        1px solid #ddceb4;
    }

    .countdown div:last-child {
      border: 0;
    }

    .countdown strong {
      display: block;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 58px;

      font-weight: 500;
    }

    .countdown span {
      font-size: 10px;

      letter-spacing: .2em;

      text-transform: uppercase;

      color: var(--muted);
    }


    /* =========================
       EVENTS
    ========================== */

    .events {
      background:
        linear-gradient(
          180deg,
          #f4ecdf,
          #e9ddca
        );
    }

    .event-grid {
      max-width: 1080px;

      margin: auto;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 28px;
    }

    .card {
      padding:
        44px 32px;

      border:
        1px solid #cdbb9d;

      border-radius: 24px;

      background:
        #fffaf2cc;

      box-shadow:
        0 24px 60px #6c543018;

      position: relative;

      overflow: hidden;
    }

    .card::before {
      content: "";

      position: absolute;

      inset: 10px;

      border:
        1px solid #b8893e2b;

      border-radius: 18px;

      pointer-events: none;
    }

    .icon {
      font-size: 38px;

      color: var(--gold);
    }

    .card h3,
    .location-card h3 {
      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 32px;

      font-weight: 600;

      margin:
        8px 0 22px;
    }

    .event-info {
      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 20px;

      margin: 9px;
    }

    .event-info span {
      color: var(--gold);
    }

    .button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      margin-top: 18px;

      padding:
        13px 22px;

      border-radius: 999px;

      background: var(--green);

      color: white;

      font-size: 11px;

      letter-spacing: .08em;

      text-transform: uppercase;

      transition: .3s ease;
    }

    .button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 10px 25px #10251d33;
    }


    /* =========================
       GALLERY
    ========================== */

    .moments {
      background: var(--cream);
    }

    .gallery {
      max-width: 1050px;

      margin: auto;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 16px;
    }

    .gallery-item {
      height: 220px;

      display: grid;

      place-items: center;

      border-radius: 20px;

      font-size: 56px;

      color: #f6dfae;

      background:
        radial-gradient(
          circle at 50% 35%,
          #735c3a,
          #211c16 70%
        );

      border:
        1px solid #b8893e55;

      box-shadow:
        inset 0 0 50px #0005;

      transition: .4s ease;
    }

    .gallery-item:hover {
      transform:
        translateY(-5px)
        scale(1.01);
    }

    .g2 {
      background:
        radial-gradient(
          circle at 50% 35%,
          #31503d,
          #0b1711 70%
        );
    }

    .g3 {
      background:
        radial-gradient(
          circle at 50% 35%,
          #8e7250,
          #241c14 70%
        );
    }

    .g4 {
      background:
        radial-gradient(
          circle at 50% 35%,
          #536653,
          #101812 70%
        );
    }

    .g5 {
      background:
        radial-gradient(
          circle at 50% 35%,
          #b08b56,
          #2a2117 70%
        );
    }

    .g6 {
      background:
        radial-gradient(
          circle at 50% 35%,
          #6f5b42,
          #1b1712 70%
        );
    }

    .gallery-note {
      max-width: 680px;

      margin:
        30px auto 0;

      font-family:
        "Cormorant Garamond",
        serif;

      font-size: 21px;

      line-height: 1.6;
    }


    /* =========================
       LOCATION
    ========================== */

    .location {
      background: #f8f0e3;
    }

    .location-card {
      max-width: 900px;

      margin: 16px auto;

      display: flex;

      align-items: center;

      justify-content: space-between;

      text-align: left;

      padding:
        30px 34px;

      border:
        1px solid #d2c1a5;

      border-radius: 20px;

      background: #fffaf2;

      box-shadow:
        0 14px 35px #6c543010;
    }

    .location-card p {
      margin: 0;

      color: var(--muted);

      font-size: 13px;
    }

    .pin {
      font-size: 25px;

      color: var(--gold);
    }

    .location-card .button {
      margin: 0;
    }


    /* =========================
       RSVP
    ========================== */

    .rsvp {
      padding:
        125px 7vw;

      text-align: center;

      background:
        radial-gradient(
          circle at 50% 0,
          #31503d,
          #10241c 55%,
          #07140f
        );

      color: #fff;

      position: relative;

      overflow: hidden;
    }

    .rsvp::before {
      content:
        "✦  ·  ✧  ·  ✦";

      position: absolute;

      top: 35px;
      left: 50%;

      transform:
        transl
